name: wheel-robot
services:
  scene-builder:
    image: wheel-robot-scene-builder:blender-4.5.3
    build:
      context: .
      dockerfile: docker/Dockerfile.blender
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,size=2g"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ./tests:/workspace/tests:ro
      - ./assets/generated:/workspace/assets/generated:rw
      - ./assets/robots:/workspace/assets/robots:ro
      - ./outputs:/workspace/outputs:rw
    mem_limit: 12g
    cpus: 8
  isaac-sim:
    image: ${ISAAC_IMAGE:-nvcr.io/nvidia/isaac-sim:6.0.1}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    group_add: ["1234"]
    working_dir: /isaac-sim
    entrypoint: [/isaac-sim/python.sh]
    command: [/workspace/scripts/run_sim.py, --steps, "0"]
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      NVIDIA_DRIVER_CAPABILITIES: all
      HOME: /isaac-sim
      PYTHONNOUSERSITE: "1"
      OMNICLIENT_HUB_MODE: exclusive
      OMNICLIENT_HUB_CACHE_DIR: /isaac-sim/.cache/omniverse-hub
      MPLCONFIGDIR: /tmp/matplotlib
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      disable: true
    shm_size: 2gb
    mem_limit: 32g
    cpus: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-1}"]
              capabilities: [gpu]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ./tests:/workspace/tests:ro
      - ./assets:/workspace/assets:ro
      - ./outputs:/workspace/outputs:rw
      - ./.runtime/isaac/kit-cache:/isaac-sim/kit/cache:rw
      - ./.runtime/isaac/kit-data:/isaac-sim/kit/data:rw
      - ./.runtime/isaac/kit-config:/isaac-sim/kit/config:rw
      - ./.runtime/isaac/user-config:/isaac-sim/.config:rw
      - ./.runtime/isaac/cache:/isaac-sim/.cache:rw
      - ./.runtime/isaac/compute:/isaac-sim/.nv/ComputeCache:rw
      - ./.runtime/isaac/omniverse:/isaac-sim/.nvidia-omniverse:rw
      - ./.runtime/isaac/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ./.runtime/isaac/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ./.runtime/isaac/ov:/isaac-sim/.local/share/ov:rw
      - ./.runtime/isaac/data:/isaac-sim/.local/share/ov/data:rw
      - ./.runtime/isaac/pkg:/isaac-sim/.local/share/ov/pkg:rw
  assemble:
    extends: isaac-sim
    profiles: [tools]
    command: [/workspace/scripts/assemble_scene.py]
    volumes:
      - ./assets/generated:/workspace/assets/generated:rw
  robot-builder:
    extends: isaac-sim
    profiles: [tools]
    command: [/workspace/scripts/import_robot.py]
    volumes:
      - ./assets/robots/generated:/workspace/assets/robots/generated:rw
