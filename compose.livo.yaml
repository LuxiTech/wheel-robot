name: wheel-robot
services:
  fast-livo:
    image: wheel-robot-fast-livo2:humble
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "67"
      LIVO_SESSION_AFTER: "${LIVO_SESSION_AFTER:-0}"
      LIVO_DIAGNOSTIC_NO_VISION: "${LIVO_DIAGNOSTIC_NO_VISION:-0}"
    command: [python3, /workspace/scripts/livo_ros_bridge.py]
    mem_limit: 8g
    cpus: 4
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ./outputs:/workspace/outputs:rw
