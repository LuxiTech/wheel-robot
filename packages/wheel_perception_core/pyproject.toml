[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-perception-core"
version = "0.3.0"
description = "RGB-D, learned perception and geometric grasp targets"
requires-python = ">=3.8"
dependencies = ["wheel-task-core>=0.3.0", "numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<6"]

[tool.setuptools.packages.find]
include = ["wheel_perception_core*"]
