[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-task-core"
version = "0.3.0"
description = "Framework-independent task contracts and orchestration"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["wheel_task_core*"]
