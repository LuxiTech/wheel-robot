[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-motion-core"
version = "0.3.0"
description = "Kinematics, collision checks and offline trajectory planning"
requires-python = ">=3.8"
dependencies = ["wheel-task-core>=0.3.0", "numpy>=1.24,<3", "scipy>=1.10,<2", "trimesh>=4,<6"]

[tool.setuptools.packages.find]
include = ["wheel_motion_core*"]
