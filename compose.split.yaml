# Separate runtime caches and a shared tmpfs mailbox for the two processes.
services:
  isaac-sim:
    cpus: ${RELAY_CPU_LIMIT:-8}
    mem_limit: 24g
    volumes:
      - ${RELAY_IPC_DIR:?Set RELAY_IPC_DIR}:/workspace/relay_ipc:rw
      - ${RELAY_RUNTIME_ROOT:?Set RELAY_RUNTIME_ROOT}/kit-cache:/isaac-sim/kit/cache:rw
      - ${RELAY_RUNTIME_ROOT}/kit-data:/isaac-sim/kit/data:rw
      - ${RELAY_RUNTIME_ROOT}/kit-config:/isaac-sim/kit/config:rw
      - ${RELAY_RUNTIME_ROOT}/user-config:/isaac-sim/.config:rw
      - ${RELAY_RUNTIME_ROOT}/cache:/isaac-sim/.cache:rw
      - ${RELAY_RUNTIME_ROOT}/compute:/isaac-sim/.nv/ComputeCache:rw
      - ${RELAY_RUNTIME_ROOT}/omniverse:/isaac-sim/.nvidia-omniverse:rw
      - ${RELAY_RUNTIME_ROOT}/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${RELAY_RUNTIME_ROOT}/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ${RELAY_RUNTIME_ROOT}/ov:/isaac-sim/.local/share/ov:rw
      - ${RELAY_RUNTIME_ROOT}/data:/isaac-sim/.local/share/ov/data:rw
      - ${RELAY_RUNTIME_ROOT}/pkg:/isaac-sim/.local/share/ov/pkg:rw
